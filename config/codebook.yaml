codebook:
  version: "v02"
  description: "Codebook for AI-assisted extraction of building simulation studies for systematic review/meta-analysis. Supports both classic intervention and factorial simulation designs."

fields:

  - field_name: article_title
    entity_level: article
    label: "Article title"
    definition: "Full title of the article."
    data_type: string
    required: true
    critical: false
    evidence_required: false
    human_validation_required: false

  - field_name: authors
    entity_level: article
    label: "Authors"
    definition: "Authors of the article."
    data_type: string
    required: true
    critical: false
    evidence_required: false
    human_validation_required: false

  - field_name: publication_year
    entity_level: article
    label: "Publication year"
    definition: "Year of publication."
    data_type: integer
    required: true
    critical: false
    evidence_required: false
    human_validation_required: false

  - field_name: doi
    entity_level: article
    label: "DOI"
    definition: "Digital Object Identifier if reported."
    data_type: string
    required: false
    critical: false
    evidence_required: false
    human_validation_required: false

  - field_name: study_type
    entity_level: article
    label: "Study type"
    definition: "Type of study design."
    data_type: categorical
    allowed_values:
      - simulation
      - measured
      - hybrid
      - review
      - unclear
    required: true
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: simulation_software
    entity_level: article
    label: "Simulation software"
    definition: "Software or engine used for building performance simulation."
    data_type: string
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
    extraction_instruction: "Extract only software explicitly mentioned, e.g., EnergyPlus, DesignBuilder, TRNSYS, IESVE, OpenStudio."

  - field_name: scenario_label
    entity_level: scenario
    label: "Scenario label"
    definition: "Label or description of a specific simulation scenario, case, alternative, or model. Must uniquely identify this exact parameter combination."
    data_type: string
    required: true
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: scenario_family
    entity_level: scenario
    label: "Scenario family"
    definition: "High-level group this scenario belongs to. For intervention studies: 'baseline' or 'intervention'. For factorial studies: use the study's own grouping (e.g., 'baseline', 'ideal', 'power_failure', 'retrofit_A')."
    data_type: string
    required: true
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: building_typology
    entity_level: scenario
    label: "Building typology"
    definition: "Main building type evaluated in the scenario."
    data_type: categorical
    allowed_values:
      - residential
      - office
      - school
      - hospital
      - commercial
      - mixed_use
      - prototype
      - other
      - unclear
    required: true
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: climate_location
    entity_level: scenario
    label: "Climate location"
    definition: "City, country, region, or climate location used in the scenario."
    data_type: string
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: climate_zone
    entity_level: scenario
    label: "Climate zone"
    definition: "Climate classification if explicitly reported. If the document reports the location but NOT the climate zone, the AI must look it up externally (this is the ONLY external data allowed)."
    data_type: string
    required: false
    critical: false
    evidence_required: true
    human_validation_required: true
    extraction_instruction: "Extract from the document if explicitly stated. If NOT stated but the climate_location is known, look up the correct Köppen-Geiger or ASHRAE climate zone classification using external knowledge and set climate_zone_source = 'external_lookup'."

  - field_name: climate_zone_source
    entity_level: scenario
    label: "Climate zone source"
    definition: "Indicates whether the climate zone was extracted from the document or determined via external lookup."
    data_type: categorical
    allowed_values:
      - document
      - external_lookup
    required: false
    critical: false
    evidence_required: false
    human_validation_required: true
    extraction_instruction: "Set to 'document' if the article explicitly states the climate zone. Set to 'external_lookup' if the AI determined it from the location using external knowledge or internet search."

  - field_name: weather_file
    entity_level: scenario
    label: "Weather file"
    definition: "Weather file or climate dataset used in the simulation."
    data_type: string
    required: false
    critical: false
    evidence_required: true
    human_validation_required: true

  - field_name: year
    entity_level: scenario
    label: "Reference year"
    definition: "Time period or target year for this scenario. Current conditions or future projection year."
    data_type: string
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
    extraction_instruction: "Use the actual year as reported (e.g., '2020', '2050', '2080'). Null only if the article does not specify a time dimension."

  - field_name: ssp
    entity_level: scenario
    label: "Climate pathway"
    definition: "Shared Socioeconomic Pathway, RCP, or climate projection scenario identifier."
    data_type: string
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
    extraction_instruction: "Use the identifier as reported (e.g., 'SSP2-4.5', 'SSP5-8.5', 'RCP4.5'). Use 'current' for present-day climate. Null only if not applicable."

  - field_name: operational_mode
    entity_level: scenario
    label: "Operational mode"
    definition: "Operational status of building systems in this scenario."
    data_type: categorical
    allowed_values:
      - normal_operation
      - power_outage
      - hvac_off
      - natural_ventilation_only
      - maximum_cooling
      - free_running
      - other
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
    extraction_instruction: "Describe the operational state of active systems. A power outage is NOT a passive design strategy — use 'power_outage' not 'passive_design'."

  - field_name: baseline_description
    entity_level: scenario
    label: "Baseline description"
    definition: "Description of the reference, control, or base case scenario. For factorial simulation studies, describe the scenario conditions."
    data_type: string
    required: true
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: intervention_description
    entity_level: intervention
    label: "Intervention description"
    definition: "Description of the evaluated strategy, measure, or package. Null if this scenario is not an intervention."
    data_type: string
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: intervention_type
    entity_level: intervention
    label: "Intervention type"
    definition: "Type of strategy evaluated."
    data_type: categorical
    allowed_values:
      - insulation
      - glazing
      - shading
      - ventilation
      - hvac
      - passive_design
      - renewable_energy
      - controls
      - envelope
      - package
      - operational_change
      - not_applicable
      - other
      - unclear
    required: true
    critical: true
    evidence_required: true
    human_validation_required: true
    extraction_instruction: "Use 'not_applicable' for scenarios that are not interventions (e.g., baseline scenarios, climate projections, power outages). A power outage should use 'not_applicable' or 'operational_change', NOT 'passive_design'."

  - field_name: is_package
    entity_level: intervention
    label: "Is package"
    definition: "Whether the intervention combines multiple strategies."
    data_type: boolean
    required: true
    critical: true
    evidence_required: true
    human_validation_required: true
    extraction_instruction: "If the paper reports a combined package, do not separate individual effects unless explicitly reported."

  - field_name: cooling_demand
    entity_level: outcome
    label: "Cooling demand"
    definition: "Cooling energy demand for a specific scenario."
    data_type: numeric
    original_unit_required: true
    standard_unit: "kWh/m2.year"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
    allowed_source_types:
      - text
      - table
      - figure
    extraction_instruction: "Extract only if cooling demand is explicitly reported. Do not infer from total energy use."

  - field_name: heating_demand
    entity_level: outcome
    label: "Heating demand"
    definition: "Heating energy demand for a specific scenario."
    data_type: numeric
    original_unit_required: true
    standard_unit: "kWh/m2.year"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
    allowed_source_types:
      - text
      - table
      - figure

  - field_name: total_energy_use
    entity_level: outcome
    label: "Total energy use"
    definition: "Total building energy use, consumption, or demand."
    data_type: numeric
    original_unit_required: true
    standard_unit: "kWh/m2.year"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
    allowed_source_types:
      - text
      - table
      - figure

  - field_name: carbon_emissions
    entity_level: outcome
    label: "Carbon emissions"
    definition: "Operational carbon emissions or equivalent emissions."
    data_type: numeric
    original_unit_required: true
    standard_unit: "kgCO2/m2.year"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: discomfort_hours
    entity_level: outcome
    label: "Discomfort hours"
    definition: "Number of hours outside thermal comfort range."
    data_type: numeric
    original_unit_required: true
    standard_unit: "h/year"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: indoor_temperature
    entity_level: outcome
    label: "Indoor temperature"
    definition: "Reported indoor temperature outcome."
    data_type: numeric
    original_unit_required: true
    standard_unit: "degC"
    required: false
    critical: false
    evidence_required: true
    human_validation_required: true

  - field_name: MPMV
    entity_level: outcome
    label: "Modified Predicted Mean Vote"
    definition: "Thermal comfort metric based on predicted mean vote, modified for specific conditions."
    data_type: numeric
    original_unit_required: true
    standard_unit: "dimensionless"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: HIHH
    entity_level: outcome
    label: "Heat Index Health Hours"
    definition: "Cumulative hours where the heat index exceeds health thresholds."
    data_type: numeric
    original_unit_required: true
    standard_unit: "h"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: IOD
    entity_level: outcome
    label: "Indoor Overheating Degree"
    definition: "Metric quantifying the degree and duration of indoor overheating."
    data_type: numeric
    original_unit_required: true
    standard_unit: "degC·h"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: HE
    entity_level: outcome
    label: "Heat Exposure"
    definition: "Metric for cumulative heat exposure experienced by occupants."
    data_type: numeric
    original_unit_required: true
    standard_unit: "h"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: WBGT
    entity_level: outcome
    label: "Wet Bulb Globe Temperature"
    definition: "Composite heat stress index combining temperature, humidity, wind, and radiation."
    data_type: numeric
    original_unit_required: true
    standard_unit: "degC"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true

  - field_name: HI
    entity_level: outcome
    label: "Heat Index"
    definition: "Index combining air temperature and relative humidity to describe perceived temperature."
    data_type: numeric
    original_unit_required: true
    standard_unit: "degF"
    required: false
    critical: true
    evidence_required: true
    human_validation_required: true
